name: docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: aoheyra/aoheyra-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    if: (github.repository == 'aoheyra/aoheyra-docs' || github.event_name == 'pull_request') && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      - name: referenced docs exist
        run: |
          set -euo pipefail
          for f in docs/ownership.md docs/protocol.md docs/operations.md; do
            test -s "$f"
          done
      - name: validate DOC-01 ownership map
        run: python3 scripts/check_doc_01.py
      - name: validate DOC-02 packet reference
        run: python3 scripts/check_doc_02.py
      - name: validate DOC-03 BLE contract
        run: python3 scripts/check_doc_03.py
      - name: validate DOC-04 identity and trust
        run: python3 scripts/check_doc_04.py
      - name: validate DOC-05 store lifecycle
        run: python3 scripts/check_doc_05.py
      - name: validate DOC-06 ephemeral state
        run: python3 scripts/check_doc_06.py
      - name: checkout fuzz inventory
        uses: actions/checkout@v4
        with:
          repository: aoheyra/aoheyra-fuzz
          path: .fuzz-inventory
      - name: validate DOC-07 fuzz inventory
        env:
          FUZZ_REPO: ${{ github.workspace }}/.fuzz-inventory
        run: python3 scripts/check_doc_07.py
      - name: markdown links and workflow syntax
        run: bash scripts/validate-docs.sh
      - name: validate DOC-08 build and release
        run: python3 scripts/check_doc_08.py
      - name: validate DOC-09 payload schema
        run: python3 scripts/check_doc_09.py

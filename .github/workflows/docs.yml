name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      - name: referenced docs exist
        run: |
          set -euo pipefail
          for f in docs/ownership.md docs/protocol.md docs/operations.md; do
            test -s "$f"
          done

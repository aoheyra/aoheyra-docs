name: docs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: aoheyra/aoheyra-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    if: (github.repository == 'aoheyra/aoheyra-docs' || github.event_name == 'pull_request') && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      - name: referenced docs exist
        run: |
          set -euo pipefail
          for f in docs/ownership.md docs/protocol.md docs/operations.md; do
            test -s "$f"
          done
      - name: validate DOC-01 ownership map
        run: python3 scripts/check_doc_01.py
      - name: validate DOC-02 packet reference
        run: python3 scripts/check_doc_02.py
      - name: markdown links and workflow syntax
        run: bash scripts/validate-docs.sh

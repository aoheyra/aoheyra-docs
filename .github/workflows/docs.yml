name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: aoheyra/aoheyra-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    if: github.repository == 'aoheyra/aoheyra-docs' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
      - name: referenced docs exist
        run: |
          set -euo pipefail
          for f in docs/ownership.md docs/protocol.md docs/operations.md; do
            test -s "$f"
          done
